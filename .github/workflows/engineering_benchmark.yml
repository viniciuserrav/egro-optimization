name: engineering_benchmark

# Run the 7-algorithm competition on the five constrained engineering design
# problems (spring, pressure vessel, welded beam, speed reducer, and the
# 10-bar truss with a real FE solve per evaluation) using the dict-based
# problem registry consumed by run_engineering.py.  Single job: the whole
# campaign (5 problems x 7 algorithms x 30 seeds, budgets up to 10^4 FE)
# fits comfortably inside one runner.

on:
  workflow_dispatch:        # manual trigger (avoids surprise runs)

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.4.4 scipy==1.17.1 opfunu==1.0.1 cma==4.4.4

      - name: Verify problem formulations against published optima
        run: python code/engineering_problems.py

      - name: Run the campaign
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          PYTHONHASHSEED: '0'
        run: |
          mkdir -p results
          python code/run_engineering.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: engineering_results
          path: results/engineering_results*.json
